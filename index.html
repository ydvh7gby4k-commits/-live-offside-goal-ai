<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REFEREE AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{
    margin:0;
    background:#101010;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin:15px;
}

#video{
    width:95%;
    max-width:900px;
    border-radius:15px;
}

#canvas{
    position:absolute;
    left:2.5%;
    top:70px;
    width:95%;
    max-width:900px;
}

button{
    padding:14px 18px;
    margin:8px;
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
}

.start{
    background:#00c853;
    color:white;
}

#status{
    margin:15px;
    font-size:18px;
}
</style>
</head>

<body>

<h1>⚽ REFEREE AI</h1>

<button class="start" onclick="startAI()">
📷 KAMERANI YOQISH
</button>

<div id="status">
🤖 AI yuklanmoqda...
</div>

<div style="position:relative;">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let model;

async function loadAI(){

    document.getElementById("status").innerText =
        "🤖 AI model yuklanmoqda...";

    model = await cocoSsd.load();

    document.getElementById("status").innerText =
        "✅ AI tayyor";

}

async function startAI(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"environment",
                width:{ideal:1280},
                height:{ideal:720}
            },
            audio:false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            detect();

        };

    }catch(error){

        document.getElementById("status").innerText =
            "❌ Kameraga ruxsat berilmadi";

    }

}

async function detect(){

    if(!model){
        requestAnimationFrame(detect);
        return;
    }

    const predictions =
        await model.detect(video);

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let players = 0;
    let balls = 0;

    predictions.forEach(prediction => {

        const [x,y,width,height] =
            prediction.bbox;

        if(prediction.class === "person"){
            players++;
        }

        if(prediction.class === "sports ball"){
            balls++;
        }

        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 3;

        ctx.strokeRect(
            x,
            y,
            width,
            height
        );

        ctx.fillStyle = "#00ff00";
        ctx.font = "18px Arial";

        ctx.fillText(
            prediction.class +
            " " +
            Math.round(prediction.score*100) +
            "%",
            x,
            y > 20 ? y-5 : y+20
        );

    });

    document.getElementById("status").innerText =
        "👤 Futbolchilar: " + players +
        "   ⚽ To‘p: " + balls;

    requestAnimationFrame(detect);

}

loadAI();

</script>

</body>
</html>
