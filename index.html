<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offside Detector (VAR)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    h2 { margin-bottom: 10px; }
    .controls {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    input[type="file"], input[type="range"] {
      margin: 10px 0;
      width: 90%;
    }
    .canvas-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      border: 2px solid #333;
      border-radius: 8px;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active { background: #218838; }
  </style>
</head>
<body>

  <h2>⚽ Offside Line (VAR) Generator</h2>

  <div class="controls">
    <label>1. Futbol rasmini yuklang:</label><br>
    <input type="file" id="upload" accept="image/*"><br><br>
    
    <label>2. Chiziq burchagi (Angle):</label><br>
    <input type="range" id="angle" min="-45" max="45" value="0"><br>

    <p style="font-size: 12px; color: #aaa;">Rasm ustiga bosing — chiziq o'sha joyga tushadi.</p>
  </div>

  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const angleSlider = document.getElementById('angle');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let img = new Image();
    let lineX = 0;
    let lineY = 0;
    let imageLoaded = false;

    // Rasm yuklanganda
    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          lineX = canvas.width / 2;
          lineY = canvas.height / 2;
          imageLoaded = true;
          draw();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Ekran bosilganda (sichqoncha yoki barmat bilan)
    function setLinePosition(e) {
      if (!imageLoaded) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      lineX = (clientX - rect.left) * scaleX;
      lineY = (clientY - rect.top) * scaleY;
      draw();
    }

    canvas.addEventListener('click', setLinePosition);
    canvas.addEventListener('touchstart', (e) => {
      setLinePosition(e);
      e.preventDefault();
    });

    // Slayder o'zgarganda
    angleSlider.addEventListener('input', () => {
      if (imageLoaded) draw();
    });

    // Chizish funksiyasi
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      const angle = parseFloat(angleSlider.value) * (Math.PI / 180);
      const length = Math.max(canvas.width, canvas.height) * 2;

      // Offsayd chizigi (Qizil VAR chizig'i)
      ctx.save();
      ctx.translate(lineX, lineY);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.moveTo(0, -length);
      ctx.lineTo(0, length);
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
      ctx.lineWidth = Math.max(3, canvas.width / 300);
      ctx.setLineDash([10, 5]); // VAR punktir chizigi
      ctx.stroke();

      ctx.restore();

      // Belgilangan nuqta (O'yinchi joylashuvi)
      ctx.beginPath();
      ctx.arc(lineX, lineY, 6, 0, Math.2 * Math.PI);
      ctx.fillStyle = 'yellow';
      ctx.fill();
    }
  </script>

</body>
</html>
