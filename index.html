<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOAL LINE AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080b10;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
h1{margin:15px}
#status,#result{
  margin:10px auto;
  padding:12px;
  max-width:800px;
  border-radius:10px;
  background:#151b22;
}
.stage{
  position:relative;
  width:96%;
  max-width:900px;
  margin:auto;
  background:#000;
  overflow:hidden;
  border-radius:15px;
}
video,img{
  width:100%;
  display:block;
}
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
#goalLine{
  display:none;
  position:absolute;
  left:0;
  right:0;
  bottom:15%;
  height:5px;
  background:red;
  box-shadow:0 0 15px red;
}
button,label{
  display:inline-block;
  border:0;
  border-radius:10px;
  padding:13px 15px;
  margin:5px;
  font-weight:bold;
  cursor:pointer;
}
.green{background:#00a86b;color:white}
.red{background:#d50000;color:white}
.blue{background:#1976d2;color:white}
.goal{background:#087f23;color:white}
.no{background:#b71c1c;color:white}
input{display:none}
</style>
</head>

<body>

<h1>⚽ GOAL LINE AI</h1>

<div id="status">🤖 AI yuklanmoqda...</div>

<h2>🔴 LIVE</h2>

<div class="stage">
  <video id="liveVideo" autoplay playsinline></video>
  <canvas id="liveCanvas"></canvas>
  <div id="goalLine"></div>
</div>

<button class="green" onclick="startCamera()">📷 KAMERA YOQISH</button>
<button class="red" onclick="stopCamera()">⛔ KAMERA O‘CHIRISH</button>
<button class="blue" onclick="toggleLine()">🥅 GOAL LINE</button>

<h2>📸 SCREENSHOT</h2>

<label class="blue">
  📸 RASM TANLASH
  <input type="file" accept="image/*" onchange="analyzeImage(event)">
</label>

<div class="stage">
  <img id="photo" style="display:none">
  <canvas id="photoCanvas"></canvas>
</div>

<h2>🎥 VIDEO / EKRAN YOZUVI</h2>

<label class="blue">
  🎥 VIDEO TANLASH
  <input type="file" accept="video/*" onchange="loadVideo(event)">
</label>

<div class="stage">
  <video id="fileVideo" controls style="display:none"></video>
</div>

<div id="result">
  ⚪ NATIJA: KUTILMOQDA
</div>

<button class="goal" onclick="setResult('⚽ GOAL')">⚽ GOAL</button>
<button class="no" onclick="setResult('❌ NO GOAL')">❌ NO GOAL</button>

<script>

let model=null;
let stream=null;
let running=false;

const liveVideo=document.getElementById("liveVideo");
const liveCanvas=document.getElementById("liveCanvas");
const liveCtx=liveCanvas.getContext("2d");

const statusBox=document.getElementById("status");
const resultBox=document.getElementById("result");

async function loadAI(){

  try{
    model=await cocoSsd.load();

    statusBox.innerText=
      "✅ AI tayyor — kamera yoki rasm tanlang";

  }catch(error){

    statusBox.innerText=
      "❌ AI yuklanmadi. Internetni tekshiring.";
  }
}

async function startCamera(){

  if(!model){
    statusBox.innerText=
      "⏳ AI hali yuklanmoqda...";
    return;
  }

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    liveVideo.srcObject=stream;
    running=true;

    liveVideo.onloadedmetadata=()=>{

      liveCanvas.width=liveVideo.videoWidth;
      liveCanvas.height=liveVideo.videoHeight;

      detectLive();
    };

    statusBox.innerText=
      "🟢 LIVE AI ISHLAYAPTI";

  }catch(error){

    statusBox.innerText=
      "❌ Kameraga ruxsat berilmadi";
  }
}

function stopCamera(){

  running=false;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  liveVideo.srcObject=null;

  liveCtx.clearRect(
    0,0,
    liveCanvas.width,
    liveCanvas.height
  );

  statusBox.innerText="📷 Kamera o‘chiq";
}

async function detectLive(){

  if(!running || !model)return;

  const predictions=await model.detect(liveVideo);

  liveCtx.clearRect(
    0,0,
    liveCanvas.width,
    liveCanvas.height
  );

  let ballFound=false;

  predictions.forEach(p=>{

    const [x,y,w,h]=p.bbox;

    if(p.class==="sports ball"){
      ballFound=true;

      liveCtx.strokeStyle="lime";
      liveCtx.lineWidth=4;
      liveCtx.strokeRect(x,y,w,h);

      liveCtx.fillStyle="lime";
      liveCtx.font="18px Arial";
      liveCtx.fillText(
        "⚽ BALL "+Math.round(p.score*100)+"%",
        x,
        Math.max(20,y-5)
      );
    }
  });

  statusBox.innerText=
    ballFound
    ? "⚽ To‘p aniqlandi"
    : "🔍 To‘p qidirilmoqda...";

  requestAnimationFrame(detectLive);
}

function toggleLine(){

  const line=document.getElementById("goalLine");

  line.style.display=
    line.style.display==="block"
    ? "none"
    : "block";
}

async function analyzeImage(event){

  const file=event.target.files[0];

  if(!file)return;

  const img=document.getElementById("photo");

  img.src=URL.createObjectURL(file);
  img.style.display="block";

  img.onload=async()=>{

    if(!model){
      resultBox.innerText=
        "⏳ AI yuklandi";
      return;
    }

    const predictions=
      await model.detect(img);

    const ball=
      predictions.find(
        p=>p.class==="sports ball"
      );

    if(ball){

      resultBox.innerText=
        "⚽ TO‘P ANIQLANDI — GOAL LINE TEKSHIRISH KERAK";

    }else{

      resultBox.innerText=
        "🔍 TO‘P ANIQLANMADI — REVIEW";
    }
  };
}

function loadVideo(event){

  const file=event.target.files[0];

  if(!file)return;

  const video=document.getElementById("fileVideo");

  video.src=URL.createObjectURL(file);
  video.style.display="block";

  resultBox.innerText=
    "🎥 VIDEO YUKLANDI — KADRMA-KADR TAHLIL UCHUN TAYYOR";
}

function setResult(text){

  resultBox.innerText=
    "🧑‍⚖️ "+text;
}

loadAI();

</script>

</body>
</html>
`
